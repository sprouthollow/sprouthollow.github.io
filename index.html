<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7cc46a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprout Hollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sprout Hollow</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1>Sprout Hollow</h1>
  <div class="stats">
    <span class="pill" id="coins"></span><span class="pill" id="gems"></span>
    <span class="pill" id="lvl"></span><span class="pill" id="day"></span><span class="pill" id="wx"></span>
    <button class="btn hb" id="mbtn" aria-pressed="true">Music on</button><button class="btn hb" id="sbtn" aria-pressed="true">Sounds on</button>
  </div>
</header>
<div class="scene" aria-hidden="true"><svg viewBox="0 0 800 190" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc3e8"/><stop offset=".7" stop-color="#d8ecf2"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<filter id="wc"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
<radialGradient id="cl" cx=".5" cy=".4"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eef4f8"/></radialGradient></defs>
<rect width="800" height="190" fill="url(#sk)"/>
<g class="cloud" filter="url(#wc)"><g fill="url(#cl)"><circle cx="120" cy="60" r="34"/><circle cx="160" cy="44" r="42"/><circle cx="205" cy="62" r="30"/><rect x="90" y="60" width="140" height="30" rx="15"/></g></g>
<g class="cloud b" filter="url(#wc)" opacity=".85"><g fill="url(#cl)"><circle cx="460" cy="40" r="26"/><circle cx="495" cy="30" r="32"/><circle cx="530" cy="44" r="22"/><rect x="440" y="40" width="110" height="22" rx="11"/></g></g>
<path d="M0 130 Q150 80 320 118 T640 104 T800 112 V190 H0z" fill="#a9cf8e" filter="url(#wc)"/>
<path d="M0 150 Q200 112 400 142 T800 132 V190 H0z" fill="#86b96c"/>
<g transform="translate(600 92)"><rect x="0" y="22" width="56" height="34" fill="#f5e6c8"/><path d="M-6 24 L28 -4 L62 24z" fill="#c4614a"/><rect x="22" y="36" width="12" height="20" fill="#7a5032"/><rect x="40" y="30" width="10" height="9" fill="#9fd2e8"/><rect x="40" y="2" width="8" height="14" fill="#8a6a5a"/></g>
<g fill="#5e9a54"><circle cx="70" cy="132" r="22"/><circle cx="92" cy="124" r="18"/><rect x="78" y="140" width="6" height="16" fill="#6b4a2a"/></g>
<path d="M0 172 Q400 150 800 170 V190 H0z" fill="#6fa85a"/>
<g fill="#fff" opacity=".9"><circle cx="230" cy="166" r="3"/><circle cx="260" cy="172" r="2.5"/><circle cx="520" cy="164" r="3"/><circle cx="700" cy="170" r="2.5"/></g>
</svg></div>
<div class="tabs">
  <button class="btn" data-tab="farm">Farm</button>
  <button class="btn" data-tab="woods">Whisperwood</button>
  <button class="btn" data-tab="village">Village</button>
  <button class="btn" data-tab="cottage">Cottage</button>
  <button class="btn" data-tab="quests">Quests</button>
  <button class="btn" data-tab="journal">Journal</button>
  <button class="btn" data-tab="market">Market</button>
  <button class="btn big" data-tab="share">Share &amp; install</button>
</div>
<div class="main">
  <section>
    <div class="board" id="board">
      <div class="drop"></div>
      <div class="field" id="field"></div>
      <div class="map" id="map" hidden></div>
      <div class="critters" id="critters"></div>
      <div id="ext" hidden></div>
    </div>
    <div class="tools" id="tools"></div>
  </section>
  <aside id="side"></aside>
</div>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/entitlements.js"></script>
<script src="js/features.js"></script>
<script src="js/core.js"></script>
</body>
</html>
